name: Nightly

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  backend-all:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # No filter: every test, including the long end-to-end runs marked Suite=Nightly.
      - run: dotnet test backend/RandomRoom.slnx
