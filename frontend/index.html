<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6efe0" />
    <meta name="description" content="The Playground: live party games for reunions, cell groups and game nights." />

      <p id="boot-status" role="status" style="margin: 0; padding: 2rem 1rem; text-align: center">Loading The Playground...</p>
      <noscript><p style="margin: 0; padding: 0 1rem 2rem; text-align: center">The Playground needs JavaScript. Turn it on in your browser and reload the page.</p></noscript>
    </div>
    <script defer src="/boot-hint.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
